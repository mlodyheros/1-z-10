<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trzy Szanse — quiz ze znajomymi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="lang" class="langbtn" aria-label="Język / Language"></button>

<main id="home" class="screen">
  <div class="home-wrap">
    <h1 class="logo"><span>Trzy</span> <span class="logo-b">Szanse</span></h1>
    <p class="tag" data-i18n="tagline"></p>
    <div class="card home-card">
      <div class="editor">
        <div class="preview" id="av-preview"></div>
        <div class="parts" id="av-parts"></div>
      </div>
      <div class="home-form">
        <label class="lbl" for="name" data-i18n="yourName"></label>
        <input id="name" class="inp" maxlength="16" data-i18n-ph="namePh" autocomplete="off">
        <button id="btn-random" class="btn ghost" data-i18n="randomize"></button>
        <button id="btn-create" class="btn primary" data-i18n="createRoom"></button>
        <div class="or" data-i18n="orJoin"></div>
        <div class="join-row">
          <input id="code" class="inp code-inp" maxlength="5" data-i18n-ph="codePh" autocomplete="off">
          <button id="btn-join" class="btn" data-i18n="join"></button>
        </div>
      </div>
    </div>
  </div>
</main>

<main id="lobby" class="screen hidden"></main>

<main id="game" class="screen hidden">
  <div id="stage"><div id="world"></div></div>
  <header id="hud"></header>
  <div id="emotes" class="emotebar"></div>
  <section id="panel"></section>
</main>

<div id="toast"></div>
<script src="avatar.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
